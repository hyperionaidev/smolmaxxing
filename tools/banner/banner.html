<!doctype html>
<html><head><meta charset="utf-8">
<!-- README banner in the hyperion-ai.com style. Render with tools/banner/render.sh -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block">
<style>
:root{--bg:#F7F5F0;--fg:#191816;--muted:#68645E;--accent:#F2643D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:360px;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 72px}
h1{font-family:"Archivo";font-stretch:62%;font-weight:850;text-transform:uppercase;font-size:150px;line-height:.9;letter-spacing:-.03em;white-space:nowrap}
h1 span{display:inline-block;background:var(--accent);line-height:.8;padding:.07em .07em .03em .06em;margin-left:.05em}
.tag{font-size:22px;margin-top:24px;letter-spacing:-.005em}
.size{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted);margin-top:12px}
</style></head>
<body>
  <h1>Smol<span>maxxing.</span></h1>
  <p class="tag">Run the biggest model you can on the smallest hardware you own.</p>
  <p class="size">260K → 35B parameters</p>
</body></html>
